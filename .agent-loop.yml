# .agent-loop.yml — per-repo config for the agent-loop autopilot.
# `/agent-loop:init` generates this with detected values. Commit it. Edit freely.
version: 1

# Branch the loop targets and PRs against.
branch_base: main

# Max CODER<->REVIEWER rounds before the loop gives up and flags a human.
max_rounds: 4

# Merge behaviour when the reviewer PASSES.
#   auto_merge: true  -> arm GitHub auto-merge (merges only when required CI is green)
#   auto_merge: false -> stop at "ready to merge"; a human merges
# NOTE: auto-merge is REFUSED unless branch protection has a required status check.
auto_merge: true    # merges auto on reviewer PASS + green CI. The founder gate is at the ISSUE: only the founder applies agent:go (decision 2026-07-19)
merge_method: squash        # squash | merge | rebase

# Commands the coder/reviewer run. Detected from pyproject.toml + .github/workflows/ci.yml
# (ruff check + ruff format --check + mypy --strict on src/bricks + import-linter + pytest).
commands:
  install: "pip install -e \".[dev]\""
  test:    "python -m pytest"
  lint:    "ruff check . && ruff format --check . && mypy src/bricks && lint-imports"
  build:   "python -m build"

# What forces a human flag (see reference/hard-stops.md). Tune per repo.
hard_stops:
  # Editing any of these = a dependency change -> flag.
  dependency_files:
    - pyproject.toml
    - requirements*.txt
    - package.json
    - go.mod
    - Cargo.toml
  # Files where "routine" is a category error -> flag if touched.
  #
  # Rewritten 2026-09-01 against this tree (bricks#20). The previous list was
  # copied from another repo and all six entries matched zero tracked files:
  # the key was right, the mechanism worked, and it fenced nothing. A dead
  # pattern is not a cheap safety margin — it is what made this list look fine
  # for weeks. So every entry below is an exact tracked path, and the rule for
  # adding one is that it must match a file today.
  #
  # Keep it narrow. A fence that fires on ordinary engine work teaches everyone
  # to ignore it, which is the same failure by a slower route.
  protected_paths:
    - ".agent-loop.yml"                          # this file: it defines what may change unreviewed, so it cannot be routine to change
    - ".github/workflows/ci.yml"                 # defines the required checks; auto-merge has no other gate
    - "src/bricks/core/engine.py"                # the execute path, and the bare eval() at :346 (G4)
    - "src/bricks/core/validator_dsl.py"         # the AST whitelist that decides what generated code may contain (G5)
    - "src/bricks/core/discovery.py"             # loads arbitrary modules from a file path
    - "src/bricks/packs.py"                      # imports whatever declares a bricks.packs entry point (D7)
    - "src/bricks/core/registry.py"              # what may execute at all
    - "src/bricks/core/loader.py"                # ruamel YAML() is round-trip mode; D4 ("a blueprint is data, not code") rests on it staying that way
    - "src/bricks/core/validation.py"            # BlueprintValidator: the pre-execution check, and what G6/G8 are about
    - "src/bricks/api.py"                        # run_blueprint: the validate-before-execute boundary
    - "src/bricks/stdlib/encoding_security.py"   # compute_hash, random_string, mask_string — the real target of the old "**/redact*"
  # Deleting a file the branch didn't create -> flag.
  flag_on_file_delete: true
  # Pre-1.0 (0.x semver, no external users): in-rubric public-API edits are
  # ALLOWED; the reviewer verifies a CHANGELOG.md note instead of flagging.
  # Out-of-rubric API changes still fail review on the Spec axis.
  flag_on_public_api_change: false

# What the reviewer reads.
review:
  standards_sources:          # the "Standards" axis. docs/ below covers docs/agents/context.md, the working-context file
    - docs/DECISIONS.md       # the Decision Ledger — a PR that breaks a locked D# fails Standards
    - README.md
    - docs/
